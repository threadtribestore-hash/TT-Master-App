<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f4f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TT Partner">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Thread Tribe Partner</title>
<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap');
  :root{
    --bg:#f2f4f7; --panel:#ffffff; --panel2:#f6f8fa; --line:#e1e6ec; --text:#16202c; --dim:#617183; --input:#eef1f5;
    --accent:#1f9e93; --accent-ink:#ffffff; --accent-soft:rgba(31,158,147,0.12);
    --amber:#c97c0e; --amber-soft:rgba(240,168,60,0.16); --red:#d0453e; --red-soft:rgba(232,97,90,0.13); --green:#2f8f40; --green-soft:rgba(126,208,138,0.18);
    --shadow:0 1px 2px rgba(16,24,40,0.06), 0 1px 3px rgba(16,24,40,0.05);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0d1117; --panel:#151c26; --panel2:#111821; --line:#243244; --text:#e3eaf2; --dim:#8a9bb0; --input:#0b1118;
      --accent:#4fd1c5; --accent-ink:#06201d; --accent-soft:rgba(79,209,197,0.14);
      --amber:#f0a83c; --red:#ef6b63; --green:#7ed08a; --shadow:none; }
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body{ background:var(--bg); }
  body{ color:var(--text); font-family:'Space Grotesk', system-ui, -apple-system, sans-serif; font-size:15px; line-height:1.45; -webkit-text-size-adjust:100%;
    padding:calc(12px + env(safe-area-inset-top)) 16px calc(92px + env(safe-area-inset-bottom)); min-height:100vh; }
  .wrap{ max-width:560px; margin:0 auto; }
  button{ font:inherit; color:inherit; }
  .hidden{ display:none !important; }

  /* header */
  .top{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:6px 0 14px; }
  .top-left{ min-width:0; }
  .eyebrow{ font-size:12px; font-weight:600; color:var(--accent); letter-spacing:0.3px; }
  .title{ font-size:22px; font-weight:700; letter-spacing:-0.3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sync{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--dim); background:var(--panel); border:1px solid var(--line); padding:6px 10px; border-radius:20px; white-space:nowrap; cursor:pointer; }
  .sync i{ width:8px; height:8px; border-radius:50%; background:var(--dim); display:inline-block; }
  .sync.live i{ background:var(--green); box-shadow:0 0 0 3px var(--green-soft); }
  .sync.busy i{ background:var(--amber); }
  .sync.off i{ background:var(--red); }

  /* cards & lists */
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:12px; box-shadow:var(--shadow); }
  .h2{ font-size:13px; font-weight:600; color:var(--dim); margin:20px 4px 8px; display:flex; justify-content:space-between; align-items:center; }
  .h2 .count{ background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:0 8px; font-size:12px; }
  .muted{ color:var(--dim); font-size:13px; }
  .row{ display:flex; justify-content:space-between; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); }
  .row:last-child{ border-bottom:none; }
  .row .r{ text-align:right; font-weight:600; }
  .sw{ width:14px; height:14px; border-radius:50%; flex:none; border:1px solid rgba(127,127,127,0.35); display:inline-block; }
  .empty{ text-align:center; color:var(--dim); padding:28px 12px; }
  .empty b{ display:block; color:var(--text); font-size:17px; margin-bottom:4px; }

  /* buttons */
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; border:1px solid var(--line); background:var(--panel); border-radius:12px; padding:11px 16px; font-weight:600; font-size:14.5px; cursor:pointer; }
  .btn:active{ transform:scale(0.98); }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .btn.block{ width:100%; padding:15px 16px; font-size:16px; border-radius:14px; }
  .btn.small{ padding:8px 12px; font-size:13.5px; border-radius:10px; }
  .btn.ghost{ background:transparent; }
  .btn.danger{ color:var(--red); }
  .btn[disabled]{ opacity:0.5; }
  .link{ background:none; border:none; color:var(--accent); font-weight:600; cursor:pointer; padding:6px 0; font-size:14px; }
  .link.dim{ color:var(--dim); font-weight:500; }
  .btns{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }

  /* today */
  .hello{ font-size:15px; color:var(--dim); margin:2px 4px 12px; }
  .stats{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:6px; }
  .stat{ background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:14px; cursor:pointer; box-shadow:var(--shadow); }
  .stat .k{ font-size:12.5px; color:var(--dim); }
  .stat .v{ font-size:24px; font-weight:700; letter-spacing:-0.4px; margin-top:2px; }
  .act{ display:flex; gap:12px; align-items:flex-start; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:10px; box-shadow:var(--shadow); }
  .act .ic{ width:38px; height:38px; flex:none; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:18px; background:var(--accent-soft); }
  .act.warn .ic{ background:var(--amber-soft); } .act.bad .ic{ background:var(--red-soft); } .act.good .ic{ background:var(--green-soft); }
  .act .body{ flex:1; min-width:0; }
  .act .t{ font-weight:600; }
  .act .s{ font-size:13px; color:var(--dim); margin-top:1px; }
  .act .btns{ margin-top:10px; }

  /* jobs */
  .seg{ display:flex; gap:6px; overflow-x:auto; padding:2px 0 4px; margin:0 -16px; padding-left:16px; padding-right:16px; scrollbar-width:none; }
  .seg::-webkit-scrollbar{ display:none; }
  .seg button{ flex:none; border:1px solid var(--line); background:var(--panel); border-radius:20px; padding:8px 14px; font-size:13.5px; font-weight:600; color:var(--dim); cursor:pointer; }
  .seg button.on{ background:var(--text); color:var(--bg); border-color:var(--text); }
  .seg button .n{ margin-left:6px; font-size:12px; opacity:0.75; }
  .job{ display:flex; gap:12px; align-items:center; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:10px; cursor:pointer; width:100%; text-align:left; box-shadow:var(--shadow); }
  .job .body{ flex:1; min-width:0; }
  .job .t{ font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .job .s{ font-size:13px; color:var(--dim); margin-top:2px; }
  .job .chev{ color:var(--dim); font-size:20px; }
  .chip{ display:inline-block; font-size:12px; font-weight:600; padding:2px 8px; border-radius:8px; background:var(--panel2); color:var(--dim); white-space:nowrap; }
  .chip.late{ background:var(--red-soft); color:var(--red); } .chip.soon{ background:var(--amber-soft); color:var(--amber); } .chip.ok{ background:var(--green-soft); color:var(--green); }
  .chip.new{ background:var(--accent-soft); color:var(--accent); }

  /* stepper */
  .steps{ display:flex; align-items:center; margin:16px 0 4px; }
  .steps .st{ flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; font-size:11.5px; color:var(--dim); position:relative; }
  .steps .st b{ width:24px; height:24px; border-radius:50%; border:2px solid var(--line); background:var(--panel); display:flex; align-items:center; justify-content:center; font-size:12px; z-index:1; }
  .steps .st.done b{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .steps .st.now b{ border-color:var(--accent); color:var(--accent); }
  .steps .st.now{ color:var(--text); font-weight:600; }
  .steps .st:not(:first-child)::before{ content:''; position:absolute; top:12px; right:50%; width:100%; height:2px; background:var(--line); }
  .steps .st.done:not(:first-child)::before, .steps .st.now:not(:first-child)::before{ background:var(--accent); }

  /* forms */
  label{ display:block; font-size:13px; color:var(--dim); margin:12px 0 6px; font-weight:500; }
  input, textarea, select{ width:100%; background:var(--input); border:1px solid var(--line); border-radius:12px; padding:13px 14px; font:inherit; font-size:16px; color:var(--text); outline:none; }
  input:focus, textarea:focus{ border-color:var(--accent); }
  textarea{ min-height:84px; resize:vertical; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:0 10px; }
  .inrow{ display:flex; gap:8px; } .inrow input{ flex:1; }
  .hint{ font-size:12.5px; color:var(--dim); margin-top:6px; }
  .note{ border-radius:12px; padding:12px 14px; font-size:14px; margin-top:12px; }
  .note.info{ background:var(--accent-soft); } .note.warn{ background:var(--amber-soft); } .note.bad{ background:var(--red-soft); } .note.good{ background:var(--green-soft); }

  /* money */
  .big{ text-align:center; padding:22px 16px; }
  .big .k{ color:var(--dim); font-size:14px; }
  .big .v{ font-size:40px; font-weight:700; letter-spacing:-1px; margin:4px 0 2px; }
  .pill{ font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:10px; white-space:nowrap; }
  .pill.wait{ background:var(--amber-soft); color:var(--amber); } .pill.done{ background:var(--green-soft); color:var(--green); } .pill.no{ background:var(--red-soft); color:var(--red); } .pill.gray{ background:var(--panel2); color:var(--dim); }
  .bar{ height:8px; background:var(--panel2); border-radius:6px; overflow:hidden; margin-top:8px; border:1px solid var(--line); }
  .bar span{ display:block; height:100%; border-radius:6px; }

  /* bottom nav */
  .nav{ position:fixed; left:0; right:0; bottom:0; z-index:50; background:var(--panel); border-top:1px solid var(--line); padding:6px 4px calc(6px + env(safe-area-inset-bottom)); display:grid; grid-template-columns:repeat(5, 1fr); }
  .nav button{ background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 0; font-size:11.5px; font-weight:600; color:var(--dim); cursor:pointer; position:relative; }
  .nav button svg{ width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
  .nav button.on{ color:var(--accent); }
  .nav .badge{ position:absolute; top:2px; left:calc(50% + 6px); background:var(--red); color:#fff; font-size:10.5px; min-width:17px; height:17px; border-radius:9px; display:flex; align-items:center; justify-content:center; padding:0 4px; }

  /* sheet */
  .scrim{ position:fixed; inset:0; background:rgba(5,8,12,0.5); z-index:80; opacity:0; transition:opacity .2s; }
  .scrim.show{ opacity:1; }
  .sheet{ position:fixed; left:0; right:0; bottom:0; z-index:90; background:var(--bg); border-radius:22px 22px 0 0; max-height:92vh; overflow-y:auto; padding:8px 16px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(100%); transition:transform .25s ease; max-width:600px; margin:0 auto; overscroll-behavior:contain; }
  .sheet.show{ transform:none; }
  .grab{ width:40px; height:5px; border-radius:3px; background:var(--line); margin:4px auto 10px; }
  .sheet-h{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:6px; }
  .sheet-h .t{ font-size:19px; font-weight:700; letter-spacing:-0.2px; }
  .x{ background:var(--panel); border:1px solid var(--line); border-radius:50%; width:34px; height:34px; flex:none; font-size:16px; cursor:pointer; }
  details{ margin-top:14px; border-top:1px solid var(--line); padding-top:10px; }
  summary{ cursor:pointer; font-weight:600; color:var(--dim); font-size:14px; padding:6px 0; list-style:none; }
  summary::-webkit-details-marker{ display:none; }
  summary::after{ content:' ▾'; }
  details[open] summary::after{ content:' ▴'; }
  .scanbox{ position:relative; width:100%; aspect-ratio:4/3; background:#000; border-radius:14px; overflow:hidden; margin-top:10px; }
  .scanbox video{ width:100%; height:100%; object-fit:cover; }
  .scanbox::after{ content:''; position:absolute; left:10%; right:10%; top:40%; height:20%; border:2px solid rgba(255,255,255,0.85); border-radius:10px; }

  /* sign in */
  .signin{ max-width:420px; margin:40px auto 0; }
  .signin h1{ font-size:26px; letter-spacing:-0.4px; margin-bottom:6px; }
  .err{ color:var(--red); font-size:13.5px; margin-top:10px; min-height:18px; }

  .toast{ position:fixed; left:50%; bottom:calc(86px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(20px); background:var(--text); color:var(--bg); padding:11px 18px; border-radius:12px; font-size:14px; font-weight:600;
    opacity:0; transition:all .2s; z-index:200; max-width:calc(100% - 32px); text-align:center; pointer-events:none; }
  .toast.show{ opacity:1; transform:translateX(-50%); }
  .ptr{ text-align:center; font-size:12.5px; color:var(--dim); height:0; overflow:hidden; transition:height .15s; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top" id="top">
    <div class="top-left"><div class="eyebrow" id="eyebrow">Thread Tribe Partner</div><div class="title" id="title">Welcome</div></div>
    <button class="sync hidden" id="sync"><i></i><span id="syncText">Live</span></button>
  </div>
  <div class="ptr" id="ptr">Release to refresh</div>
  <div id="signin" class="hidden"></div>
  <div id="screen" class="hidden"></div>
</div>

<nav class="nav hidden" id="nav">
  <button data-tab="today"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Today</button>
  <button data-tab="jobs"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>Jobs</button>
  <button data-tab="filament"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5"/><path d="M12 4v5.5M12 14.5V20"/></svg>Filament</button>
  <button data-tab="money"><svg viewBox="0 0 24 24"><path d="M7 5h10M7 9h10M7 5c5 0 5 8 0 8l7 6"/></svg>Money</button>
  <button data-tab="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Me</button>
</nav>
<div class="scrim hidden" id="scrim"></div>
<div class="sheet hidden" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  // ======================= data & sync =======================
  var KEY = 'tt-partner-portal-v1';
  var FLOW = ['assigned', 'accepted', 'printing', 'shipped'];
  var STEP_LABEL = { assigned: 'New', accepted: 'Accepted', printing: 'Printing', shipped: 'Shipped', delivered: 'Delivered', cancelled: 'Cancelled' };
  var SWATCH = { black:'#2b2f36', white:'#f2f4f7', red:'#e8615a', blue:'#4f7fd6', green:'#7ed08a', yellow:'#f0dd52', orange:'#f0a83c', purple:'#b48cf0',
    grey:'#8a95a3', gray:'#8a95a3', silver:'#c3cad4', gold:'#d8b34a', pink:'#f08cc4', brown:'#8a5a3c', beige:'#d9c7a3', cyan:'#22d3ee', skin:'#e8b89b', ivory:'#f3ead7' };
  var EDIT_FIELDS = ['status', 'unitsShipped', 'failedPrints', 'gramsUsed', 'trackingNo', 'shippedDate', 'partnerNotes'];
  var CFG = window.TT_CONFIG || {};
  var CLOUD_URL = CFG.supabaseUrl || 'https://aeshadnzutizlpayhtnf.supabase.co';
  var CLOUD_KEY = CFG.supabaseKey || 'sb_publishable_tunpMMqpGPgRQreweefjTA_nBO7fXId';

  var store = { pack: null, edits: {}, partnerId: '', email: '', requests: [], profile: null, seenPay: {} };
  var sb = null, session = null, channel = null, live = null, reports = {};
  var cloud = { status: '', otpEmail: '', err: '', unlinked: false, saving: false, again: false, timer: null, refreshTimer: null, lastRefresh: 0, choosing: null, rtDb: '', rtLive: '', missing: false, booting: true };
  var tab = 'today', jobSeg = 'active', sheetState = null;

  function load(){
    try{
      var s = JSON.parse(localStorage.getItem(KEY));
      if(s && typeof s === 'object'){
        // Old job-pack-file copies can't sync, so only live data is kept.
        if(s.mode === 'cloud' && s.pack) store = Object.assign(store, { pack: s.pack, edits: s.edits || {}, partnerId: s.partnerId || '', email: s.email || '', requests: s.requests || [], profile: s.profile || null, seenPay: s.seenPay || {} });
        else store.email = s.email || '';
      }
    }catch(e){}
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(Object.assign({ mode: 'cloud' }, store))); }catch(e){} }
  function esc(s){ var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML.replace(/"/g, '&quot;'); }
  function num(v){ v = parseFloat(v); return isFinite(v) && v > 0 ? v : 0; }
  function money(v){ return '₹' + Math.round(v || 0).toLocaleString('en-IN'); }
  function grams(g){ g = g || 0; return Math.abs(g) >= 1000 ? (Math.round(g / 100) / 10) + ' kg' : Math.round(g) + ' g'; }
  function iso(d){ return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function today(){ return iso(new Date()); }
  function addDays(n){ var d = new Date(); d.setDate(d.getDate() + n); return iso(d); }
  function fmtDate(s){ if(!s) return ''; var d = new Date(String(s).slice(0, 10) + 'T00:00:00'); return isNaN(d) ? s : d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }); }
  function daysUntil(s){ if(!s) return null; return Math.round((new Date(s + 'T00:00:00') - new Date(today() + 'T00:00:00')) / 86400000); }
  function swatch(c){ return SWATCH[(c || '').trim().toLowerCase().split(/\s+/).pop()] || SWATCH[(c || '').trim().toLowerCase()] || '#9aa6b2'; }
  function buzz(){ try{ if(navigator.vibrate) navigator.vibrate(12); }catch(e){} }
  function toast(msg){ var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(function(){ t.classList.remove('show'); }, 2600); }
  function isOpen(j){ return FLOW.indexOf(j.status) !== -1; }
  function copy(text, msg){
    (navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(text) : Promise.reject()).then(function(){ toast(msg || 'Copied'); })
      .catch(function(){ var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); toast(msg || 'Copied'); }catch(e){} ta.remove(); });
  }

  // A job as the partner sees it: Thread Tribe's copy plus changes not yet saved.
  function job(j){
    var e = store.edits[j.id];
    if(!e) return j;
    var out = {}; for(var k in j) out[k] = j[k];
    EDIT_FIELDS.forEach(function(f){ if(e[f] !== undefined) out[f] = e[f]; });
    out._dirty = true;
    return out;
  }
  function jobs(){ return store.pack ? store.pack.jobs.map(job) : []; }
  function findJob(id){ var b = store.pack && store.pack.jobs.find(function(x){ return x.id === id; }); return b ? { base: b, j: job(b) } : null; }
  function setEdit(id, field, value){
    if(!store.edits[id]) store.edits[id] = {};
    store.edits[id][field] = value;
    store.edits[id].at = new Date().toISOString();
    save();
  }
  function dirtyCount(){ return store.pack ? store.pack.jobs.filter(function(j){ return isOpen(j) && store.edits[j.id]; }).length : 0; }
  function isLive(){ return cloud.rtLive === 'SUBSCRIBED' || cloud.rtDb === 'SUBSCRIBED'; }

  function subscribe(){
    if(channel || !sb) return;
    try{
      channel = sb.channel('tt-partner-' + Math.random().toString(36).slice(2, 8))
        .on('postgres_changes', { event: '*', schema: 'public', table: 'pon_packs' }, function(){ refreshSoon(250); })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'pon_reports' }, function(){ refreshSoon(400); })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'pon_requests' }, function(){ refreshSoon(300); })
        .subscribe(function(st){ cloud.rtDb = st; renderSync(); });
    }catch(e){}
    try{
      live = sb.channel('tt-live', { config: { broadcast: { self: false } } })
        .on('broadcast', { event: 'ping' }, function(m){ if(m && m.payload && m.payload.kind === 'packs') refreshSoon(150); })
        .subscribe(function(st){ cloud.rtLive = st; renderSync(); });
    }catch(e){}
  }
  function ping(kind){ try{ if(live && cloud.rtLive === 'SUBSCRIBED') live.send({ type: 'broadcast', event: 'ping', payload: { kind: kind } }); }catch(e){} }
  function refreshSoon(ms){ clearTimeout(cloud.refreshTimer); cloud.refreshTimer = setTimeout(refresh, ms || 0); }

  async function refresh(){
    if(!sb || !session) return;
    var r = await sb.from('pon_packs').select('partner_id,pack,updated_at').order('partner_id');
    if(r.error){ cloud.status = /fetch|network|Load failed/i.test(r.error.message || '') || !navigator.onLine ? 'offline' : 'error'; renderAll(); return; }
    var rows = r.data || [];
    cloud.unlinked = !rows.length;
    if(!rows.length){ store.pack = null; store.edits = {}; save(); renderAll(); return; }
    var row = rows.find(function(x){ return x.partner_id === store.partnerId; });
    if(!row && rows.length > 1){ cloud.choosing = rows; store.pack = null; renderAll(); return; }
    row = row || rows[0];
    cloud.choosing = null;
    var rr = await sb.from('pon_reports').select('job_id,report,updated_at').eq('partner_id', row.partner_id);
    if(rr.error){ cloud.status = 'offline'; renderAll(); return; }
    reports = {};
    (rr.data || []).forEach(function(x){ reports[x.job_id] = x; });
    cloud.status = 'ok'; cloud.lastRefresh = Date.now();
    takePack(row.pack, row.partner_id);
    try{ await loadInbox(row.partner_id); }catch(e){}
    if(dirtyCount()) scheduleSave();
    renderAll();
  }
  // Pack from Thread Tribe + anything this partner already sent that TT hasn't processed yet.
  function takePack(pack, pid){
    var prev = store.pack && store.partnerId === pid ? store.pack : null;
    var p = JSON.parse(JSON.stringify(pack || {}));
    if(!Array.isArray(p.jobs)) p.jobs = [];
    p.jobs.forEach(function(j){
      var rep = reports[j.id];
      if(!rep || !isOpen(j)) return;
      if(j.reportAt && Date.parse(rep.updated_at) <= Date.parse(j.reportAt)) return;
      var R = rep.report || {};
      if(FLOW.indexOf(R.status) > FLOW.indexOf(j.status)) j.status = R.status;
      ['unitsShipped', 'failedPrints', 'gramsUsed'].forEach(function(f){ if(typeof R[f] === 'number') j[f] = R[f]; });
      ['trackingNo', 'partnerNotes'].forEach(function(f){ if(typeof R[f] === 'string') j[f] = R[f]; });
      if(R.shippedDate) j.shippedDate = R.shippedDate;
    });
    if(store.partnerId && store.partnerId !== pid) store.edits = {};
    var kept = {};
    p.jobs.forEach(function(j){
      var e = store.edits[j.id];
      if(!e || !isOpen(j)) return;
      var diff = EDIT_FIELDS.some(function(f){ return e[f] !== undefined && String(e[f]) !== String(j[f] == null ? '' : j[f]); });
      if(diff && FLOW.indexOf(e.status || j.status) >= FLOW.indexOf(j.status)){ if(e.status && FLOW.indexOf(e.status) === FLOW.indexOf(j.status)) delete e.status; kept[j.id] = e; }
    });
    store.partnerId = pid; store.pack = p; store.edits = kept;
    save();
    if(prev && prev.generatedAt !== p.generatedAt) notifyChanges(prev, p);
  }
  function notifyChanges(prev, next){
    var before = {}, msgs = [];
    (prev.jobs || []).forEach(function(j){ before[j.id] = j; });
    (next.jobs || []).forEach(function(j){
      var o = before[j.id], name = (j.jobCode ? j.jobCode + ' ' : '') + (j.productName || 'job');
      if(!o){ if(isOpen(j)) msgs.push('New job: ' + name); return; }
      if(o.status !== j.status && (j.status === 'delivered' || j.status === 'cancelled')) msgs.push(name + (j.status === 'delivered' ? ' confirmed delivered' : ' cancelled'));
      else if(o.qty !== j.qty || o.dueDate !== j.dueDate || JSON.stringify(o.shipTo || {}) !== JSON.stringify(j.shipTo || {})) msgs.push(name + ' was updated');
    });
    var pb = (prev.payout || {}).paid || 0, pa = (next.payout || {}).paid || 0;
    if(pa > pb + 0.5) msgs.push('Payment received: ' + money(pa - pb));
    if(msgs.length){ toast(msgs.length > 2 ? msgs.slice(0, 2).join(' · ') + ' +' + (msgs.length - 2) + ' more' : msgs.join(' · ')); try{ if(navigator.vibrate) navigator.vibrate(80); }catch(e){} }
  }
  function scheduleSave(){
    if(!sb || !session) return;
    clearTimeout(cloud.timer);
    cloud.timer = setTimeout(cloudSave, 600);
    renderSync();
  }
  async function cloudSave(){
    if(!store.pack || !session) return;
    if(cloud.saving){ cloud.again = true; return; }
    var ids = Object.keys(store.edits).filter(function(id){ return store.pack.jobs.some(function(j){ return j.id === id && isOpen(j); }); });
    if(!ids.length){ cloud.status = 'ok'; renderSync(); return; }
    cloud.saving = true; renderSync();
    var sentAt = new Date().toISOString();
    var list = store.pack.jobs.filter(function(j){ return ids.indexOf(j.id) !== -1; }).map(job).map(function(j){
      return { id: j.id, status: j.status, unitsShipped: j.unitsShipped || 0, failedPrints: j.failedPrints || 0, gramsUsed: j.gramsUsed || 0,
        trackingNo: j.trackingNo || '', shippedDate: j.shippedDate || '', partnerNotes: j.partnerNotes || '' };
    });
    var r = await sb.rpc('pon_submit_report', { p_jobs: list });
    cloud.saving = false;
    if(r.error){
      cloud.status = /fetch|network|Load failed/i.test(r.error.message || '') || !navigator.onLine ? 'offline' : 'error';
      renderSync();
      clearTimeout(cloud.timer); cloud.timer = setTimeout(cloudSave, 20000);
      return;
    }
    cloud.status = 'ok';
    ping('report');
    list.forEach(function(u){
      var pj = store.pack.jobs.find(function(x){ return x.id === u.id; });
      if(pj) EDIT_FIELDS.forEach(function(f){ if(u[f] !== undefined) pj[f] = u[f]; });
      var e = store.edits[u.id];
      if(e && e.at <= sentAt) delete store.edits[u.id];
    });
    save(); renderSync();
    if(cloud.again){ cloud.again = false; scheduleSave(); }
    refreshSoon(800);
  }

  // ---- requests to Thread Tribe ----
  async function loadInbox(pid){
    var res = await Promise.all([
      sb.from('pon_requests').select('id,kind,payload,status,reply,created_at,updated_at').eq('partner_id', pid).order('created_at', { ascending: false }).limit(100),
      sb.from('pon_profiles').select('*').eq('partner_id', pid).maybeSingle()
    ]);
    if(res[0].error){ cloud.missing = /pon_requests|does not exist|schema cache|relation/i.test(res[0].error.message || ''); return; }
    cloud.missing = false;
    var before = {};
    (store.requests || []).forEach(function(q){ before[q.id] = q.status; });
    var answered = (res[0].data || []).filter(function(q){ return before[q.id] === 'open' && q.status !== 'open' && q.status !== 'cancelled' && q.kind !== 'payment_ack'; });
    store.requests = res[0].data || [];
    if(!res[1].error) store.profile = res[1].data || null;
    save();
    if(answered.length){
      var q = answered[0];
      toast('Thread Tribe replied' + (q.reply ? ': ' + q.reply : ''));
      try{ if(navigator.vibrate) navigator.vibrate(80); }catch(e){}
    }
  }
  function friendlyErr(err){
    var m = String((err && err.message) || err || '');
    if(/does not exist|schema cache/i.test(m)) return 'Thread Tribe hasn’t switched this on yet.';
    if(/fetch|network|Load failed/i.test(m)) return 'No internet — try again when you’re online.';
    return m || 'Couldn’t send.';
  }
  async function submitRequest(kind, payload){
    if(!session){ toast('Sign in again to send this'); return false; }
    var r = await sb.rpc('pon_submit_request', { p_partner_id: store.partnerId, p_kind: kind, p_payload: payload });
    if(r.error){ toast(friendlyErr(r.error)); return false; }
    ping('request');
    await loadInbox(store.partnerId);
    renderAll();
    return true;
  }
  function reqs(kind, test){ return (store.requests || []).filter(function(q){ return q.kind === kind && (!test || test(q)); }); }
  function openReq(kind, test){ return reqs(kind, function(q){ return q.status === 'open' && (!test || test(q)); }); }
  function ackFor(pid){ return reqs('payment_ack', function(q){ return q.payload && q.payload.paymentId === pid && q.status !== 'cancelled'; })[0]; }

  // ---- filament needs: what open jobs still need vs what the partner holds ----
  function filamentNeeds(){
    var need = {}, held = {}, names = {};
    jobs().forEach(function(j){
      if(['assigned', 'accepted', 'printing'].indexOf(j.status) === -1) return;
      var k = (j.color || '').trim().toLowerCase() || 'unspecified';
      names[k] = names[k] || j.color || 'Unspecified';
      need[k] = (need[k] || 0) + Math.max(0, (j.qty || 0) - (j.unitsShipped || 0)) * (j.gramsPerUnit || 0) * 1.08;
    });
    ((store.pack && store.pack.filament) || []).forEach(function(r){
      var k = (r.color || '').trim().toLowerCase() || 'unspecified';
      names[k] = names[k] || r.color;
      held[k] = (held[k] || 0) + (r.held || 0);
    });
    var keys = Object.keys(names);
    return keys.map(function(k){ return { key: k, color: names[k], need: Math.round(need[k] || 0), held: Math.round(held[k] || 0), short: Math.max(0, Math.round((need[k] || 0) - Math.max(0, held[k] || 0))) }; })
      .sort(function(a, b){ return b.short - a.short || b.need - a.need; });
  }

  // ======================= UI =======================
  function dueChip(j){
    if(j.status === 'shipped') return '<span class="chip ok">Shipped' + (j.shippedDate ? ' ' + fmtDate(j.shippedDate) : '') + '</span>';
    if(j.status === 'delivered') return '<span class="chip ok">Delivered</span>';
    if(j.status === 'cancelled') return '<span class="chip">Cancelled</span>';
    var d = daysUntil(j.dueDate);
    if(d == null) return '<span class="chip">No due date</span>';
    if(d < 0) return '<span class="chip late">' + (-d) + ' day' + (d === -1 ? '' : 's') + ' late</span>';
    if(d === 0) return '<span class="chip soon">Due today</span>';
    if(d === 1) return '<span class="chip soon">Due tomorrow</span>';
    if(d <= 3) return '<span class="chip soon">Due in ' + d + ' days</span>';
    return '<span class="chip">Due ' + fmtDate(j.dueDate) + '</span>';
  }
  function jobRow(j){
    return '<button class="job" data-a="job" data-id="' + esc(j.id) + '"><span class="sw" style="background:' + swatch(j.color) + '; width:18px; height:18px;"></span>' +
      '<span class="body"><span class="t">' + esc(j.productName || 'Job') + ' × ' + (j.qty || 0) + '</span>' +
      '<span class="s" style="display:block;">' + esc(j.jobCode || '') + (j.color ? ' · ' + esc(j.color) : '') + ' · ' + dueChip(j) + (j.status === 'assigned' ? ' <span class="chip new">New</span>' : '') +
      (j._dirty ? ' <span class="chip soon">Saving…</span>' : '') + '</span></span><span class="chev">›</span></button>';
  }
  function act(cls, icon, title, sub, btns){
    return '<div class="act ' + cls + '"><div class="ic">' + icon + '</div><div class="body"><div class="t">' + title + '</div>' + (sub ? '<div class="s">' + sub + '</div>' : '') + (btns ? '<div class="btns">' + btns + '</div>' : '') + '</div></div>';
  }
  function greeting(){ var h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening'; }

  function todayHtml(){
    var all = jobs(), p = store.pack.payout || {};

      '<div class="stat" data-a="tab" data-tab="jobs"><div class="k">Open jobs</div><div class="v">' + open.length + '</div></div></div>';
    var items = [];
    // 1. new jobs to accept
    all.filter(function(j){ return j.status === 'assigned'; }).forEach(function(j){
      if(openReq('decline', function(q){ return q.payload.jobId === j.id; }).length) return;
      items.push({ w: 1, h: act('', '🆕', 'New job: ' + esc(j.productName) + ' × ' + (j.qty || 0), esc(j.jobCode) + ' · ' + esc(j.color || '') + ' · ' + dueChip(j) + ' · earns ~' + money(j.payout),
        '<button class="btn primary small" data-a="advance" data-id="' + esc(j.id) + '">Accept</button><button class="btn small" data-a="job" data-id="' + esc(j.id) + '">View</button>') });
    });
    // 2. late or due soon
    all.filter(function(j){ return (j.status === 'accepted' || j.status === 'printing'); }).forEach(function(j){
      var d = daysUntil(j.dueDate);
      if(d == null || d > 2) return;
      var next = j.status === 'accepted' ? 'Start printing' : 'Mark shipped';
      items.push({ w: d < 0 ? 0 : 2, h: act(d < 0 ? 'bad' : 'warn', d < 0 ? '⏰' : '📦', esc(j.productName) + ' × ' + (j.qty || 0) + ' — ' + (d < 0 ? (-d) + ' day' + (d === -1 ? '' : 's') + ' late' : d === 0 ? 'due today' : d === 1 ? 'due tomorrow' : 'due in 2 days'),
        esc(j.jobCode) + ' · ' + STEP_LABEL[j.status], '<button class="btn primary small" data-a="' + (j.status === 'printing' ? 'ship' : 'advance') + '" data-id="' + esc(j.id) + '">' + next + '</button>') });
    });
    // 3. payments to confirm
    ((p.payments) || []).slice(0, 5).forEach(function(x){
      if(ackFor(x.id) || store.seenPay[x.id]) return;
      items.push({ w: 3, h: act('good', '₹', money(x.amount) + ' paid on ' + fmtDate(x.date), 'Did you receive it?' + (x.ref ? ' Ref ' + esc(x.ref) : ''),
        '<button class="btn primary small" data-a="ack-ok" data-id="' + esc(x.id) + '" data-amt="' + (x.amount || 0) + '">Yes, got it</button><button class="btn small" data-a="ack-problem" data-id="' + esc(x.id) + '" data-amt="' + (x.amount || 0) + '">Problem</button>') });
    });
    // 4. filament short
    filamentNeeds().filter(function(f){ return f.short >= 100; }).forEach(function(f){
      if(openReq('filament', function(q){ return (q.payload.color || '').toLowerCase() === f.key; }).length) return;
      items.push({ w: 4, h: act('warn', '🧵', 'Short on ' + esc(f.color) + ' filament', 'Your open jobs need ~' + grams(f.need) + '; you have ' + grams(Math.max(0, f.held)) + '.',
        '<button class="btn primary small" data-a="req-fil" data-color="' + esc(f.color) + '" data-g="' + f.short + '">Request ' + grams(Math.ceil(f.short / 500) * 500) + '</button>') });
    });
    // 5. replies in the last 3 days
    var cutoff = Date.now() - 3 * 86400000;
    (store.requests || []).filter(function(q){ return q.status !== 'open' && q.status !== 'cancelled' && q.reply && q.kind !== 'payment_ack' && Date.parse(q.updated_at) > cutoff; }).slice(0, 3).forEach(function(q){
      items.push({ w: 5, h: act(q.status === 'rejected' ? 'warn' : 'good', '💬', 'Thread Tribe: ' + esc(q.reply), reqTitle(q), '') });
    });
    // 6. setup
    var pr = store.profile || {};
    if(!cloud.missing && !(pr.upi || pr.account_no)) items.push({ w: 6, h: act('', '🏦', 'Add your UPI ID', 'So Thread Tribe can pay you straight away.', '<button class="btn small" data-a="profile">Add now</button>') });
    items.sort(function(a, b){ return a.w - b.w; });
    html += '<div class="h2">Needs you<span class="count">' + items.length + '</span></div>';
    html += items.length ? items.map(function(i){ return i.h; }).join('') : '<div class="card empty"><b>All caught up ✓</b>New jobs and payments will show up here.</div>';
    var printing = all.filter(function(j){ return j.status === 'printing' || j.status === 'accepted'; }).filter(function(j){ var d = daysUntil(j.dueDate); return d == null || d > 2; });
    if(printing.length) html += '<div class="h2">In progress<span class="count">' + printing.length + '</span></div>' + printing.map(jobRow).join('');
    return html;
  }
  function reqTitle(q){
    var P = q.payload || {};
    if(q.kind === 'payout') return 'Your payout request for ' + money(P.amount);

  var SEGS = [['active', 'Active'], ['assigned', 'New'], ['printing', 'Printing'], ['shipped', 'Shipped'], ['done', 'Done']];
  function segJobs(seg){
    return jobs().filter(function(j){
      if(seg === 'active') return j.status === 'assigned' || j.status === 'accepted' || j.status === 'printing';
      if(seg === 'assigned') return j.status === 'assigned';
      if(seg === 'printing') return j.status === 'accepted' || j.status === 'printing';
      if(seg === 'shipped') return j.status === 'shipped';
      return j.status === 'delivered' || j.status === 'cancelled';
    }).sort(function(a, b){ return seg === 'done' ? (b.deliveredDate || b.shippedDate || '').localeCompare(a.deliveredDate || a.shippedDate || '') : (a.dueDate || '9999').localeCompare(b.dueDate || '9999'); });
  }
  function jobsHtml(){

  // ---- sheet plumbing (Android back button closes it) ----
  function openSheet(state){
    var wasOpen = !!sheetState;
    sheetState = state;
    renderSheet();
    var sh = document.getElementById('sheet'), sc = document.getElementById('scrim');
    sh.classList.remove('hidden'); sc.classList.remove('hidden');
    requestAnimationFrame(function(){ sh.classList.add('show'); sc.classList.add('show'); });
    if(!wasOpen){ try{ history.pushState({ ttSheet: 1 }, ''); }catch(e){} }
  }
  function renderSheet(){
    if(!sheetState) return;
    var body = document.getElementById('sheetBody');
    // Forms are never redrawn behind the partner's back (that would wipe what they typed);
    // a plain job view is, so live changes from Thread Tribe show up.
    if(!sheetState.force && (sheetState.kind !== 'job' || sheetState.mode)) return;
    var ae = document.activeElement;
    if(ae && body.contains(ae) && /INPUT|TEXTAREA/.test(ae.tagName) && !sheetState.force) return;
    sheetState.force = false;
    body.innerHTML = sheetState.kind === 'job' ? jobSheet(sheetState.id) : formSheet(sheetState.kind, sheetState.opt);
  }
  function closeSheet(fromPop){
    if(!sheetState) return;
    stopScan();
    sheetState = null;
    var sh = document.getElementById('sheet'), sc = document.getElementById('scrim');
    sh.classList.remove('show'); sc.classList.remove('show');
    setTimeout(function(){ if(!sheetState){ sh.classList.add('hidden'); sc.classList.add('hidden'); document.getElementById('sheetBody').innerHTML = ''; } }, 220);
    if(!fromPop){ try{ if(history.state && history.state.ttSheet) history.back(); }catch(e){} }
  }
  window.addEventListener('popstate', function(){ if(sheetState) closeSheet(true); });

  // ---- AWB barcode scan ----
  var scan = null;
  function stopScan(){ if(!scan) return; scan.stop = true; try{ scan.stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){} scan = null; var a = document.getElementById('scanArea'); if(a) a.innerHTML = ''; }
  async function startScan(){
    stopScan();
    var area = document.getElementById('scanArea'); if(!area) return;
    area.innerHTML = '<div class="scanbox"><video id="scanVid" playsinline muted autoplay></video></div><div class="hint">Point at the barcode on the courier slip. <button class="link" data-a="scan-stop" style="padding:0;">Stop</button></div>';
    var s = scan = { stop: false, stream: null };
    try{
      var det = new window.BarcodeDetector({ formats: ['code_128', 'code_39', 'qr_code', 'ean_13', 'itf'] });
      var stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
      if(s.stop){ stream.getTracks().forEach(function(t){ t.stop(); }); return; }
      s.stream = stream;
      var v = document.getElementById('scanVid'); v.srcObject = stream; try{ await v.play(); }catch(e){}
      (async function tick(){
        if(s.stop || scan !== s) return;
        try{ var c = await det.detect(v); if(c && c.length){ var inp = document.getElementById('fAwb'); if(inp) inp.value = c[0].rawValue; buzz(); toast('Tracking number added'); stopScan(); return; } }catch(e){}
        setTimeout(tick, 250);
      })();
    }catch(e){ area.innerHTML = '<div class="hint">Couldn’t open the camera — type the number instead.</div>'; scan = null; }
  }

  // ---- render ----
  function renderSync(){

    el.classList.remove('hidden');
    el.classList.remove('live', 'busy', 'off');

    if(cloud.saving || (d && cloud.status !== 'offline' && cloud.status !== 'error')){ el.classList.add('busy'); t.textContent = 'Saving…'; }
    else if(cloud.status === 'offline'){ el.classList.add('off'); t.textContent = d ? 'Offline · ' + d + ' waiting' : 'Offline'; }
    else if(cloud.status === 'error'){ el.classList.add('off'); t.textContent = 'Tap to retry'; }
    else if(isLive()){ el.classList.add('live'); t.textContent = 'Live'; }
    else t.textContent = 'Connected';

    var m = String((err && err.message) || err || '');

    if(/expired|invalid|otp/i.test(m)) return 'That code didn’t work — check it, or ask for a new one.';

        '<button class="btn primary block" style="margin-top:14px;" data-si="send">Email me a code</button><div class="err" id="siErr">' + esc(cloud.err) + '</div></div>';
    } else {
      el.innerHTML = '<div class="signin card"><h1>Check your email</h1><p class="muted" style="font-size:15px;">We sent a code to <b style="color:var(--text);">' + esc(cloud.otpEmail) + '</b>. Check spam if it’s not there in a minute.</p>' +
        '<label>Code</label><input type="text" id="siCode" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="123456" style="font-size:22px; letter-spacing:6px; text-align:center;">' +
        '<button class="btn primary block" style="margin-top:14px;" data-si="verify">Sign in</button><div class="err" id="siErr">' + esc(cloud.err) + '</div>' +
        '<button class="btn ghost block" style="margin-top:6px;" data-si="restart">Use a different email</button></div>';
    }
  }
  document.getElementById('signin').addEventListener('click', async function(e){
    var b = e.target.closest('[data-si]'); if(!b) return;
    var a = b.getAttribute('data-si');
    if(a === 'restart'){ cloud.otpEmail = ''; cloud.err = ''; renderSignin(); return; }
    if(a === 'signout'){ signOut(); return; }
    if(a === 'refresh'){ refresh(); return; }
    if(a === 'pick'){ store.partnerId = b.getAttribute('data-pid'); cloud.choosing = null; save(); refresh(); return; }
    if(a === 'send'){
      var email = String(document.getElementById('siEmail').value || '').trim().toLowerCase();
      if(!okEmail(email)){ cloud.err = 'Enter a valid email address.'; renderSignin(); return; }
      b.disabled = true; b.textContent = 'Sending…';
      var r = await sb.auth.signInWithOtp({ email: email, options: { shouldCreateUser: true } });
      cloud.err = r.error ? friendlyAuth(r.error) : '';
      if(!r.error) cloud.otpEmail = email;
      renderSignin();
      setTimeout(function(){ var c = document.getElementById('siCode'); if(c) c.focus(); }, 50);
      return;
    }
    if(a === 'verify'){
      var code = String(document.getElementById('siCode').value || '').replace(/\s+/g, '');
      if(!/^\d{6,10}$/.test(code)){ cloud.err = 'Enter the code from the email.'; renderSignin(); return; }
      b.disabled = true; b.textContent = 'Checking…';
      var v = await sb.auth.verifyOtp({ email: cloud.otpEmail, token: code, type: 'email' });
      if(v.error){ cloud.err = friendlyAuth(v.error); renderSignin(); return; }
      cloud.otpEmail = ''; cloud.err = '';
      if(v.data && v.data.session) onSignedIn(v.data.session);
    }
  });
  document.getElementById('signin').addEventListener('keydown', function(e){
    if(e.key !== 'Enter') return;
    var b = document.querySelector('#signin [data-si="send"], #signin [data-si="verify"]'); if(b) b.click();
  });
  function onSignedIn(s){
    var email = String((s.user && s.user.email) || '').toLowerCase();
    var sameUser = session && session.user && session.user.id === s.user.id;
    session = s;
    if(store.email !== email){ store.pack = null; store.edits = {}; store.partnerId = ''; store.requests = []; store.profile = null; store.seenPay = {}; store.email = email; }
    save();
    if(!sameUser){ refresh(); subscribe(); }
    renderAll();
  }
  async function signOut(){
    try{ if(channel) await sb.removeChannel(channel); }catch(e){}
    try{ if(live) await sb.removeChannel(live); }catch(e){}
    channel = null; live = null; cloud.rtDb = ''; cloud.rtLive = '';
    try{ await sb.auth.signOut(); }catch(e){}
    session = null; cloud.unlinked = false; cloud.choosing = null;
    store = { pack: null, edits: {}, partnerId: '', email: store.email, requests: [], profile: null, seenPay: {} };
    save(); closeSheet(); renderAll();
  }

  // ---- actions ----
  function advance(id){
    var f = findJob(id); if(!f) return;
    var next = { assigned: 'accepted', accepted: 'printing' }[f.j.status];
    if(!next) return;
    setEdit(id, 'status', next);
    buzz();
    toast(next === 'accepted' ? 'Job accepted' : 'Marked as printing');
    scheduleSave(); renderAll();
  }
  async function onAction(e){
    var b = e.target.closest('[data-a]'); if(!b) return;
    var a = b.getAttribute('data-a'), id = b.getAttribute('data-id');
    if(a === 'tab'){ setTab(b.getAttribute('data-tab')); return; }
    if(a === 'seg'){ jobSeg = b.getAttribute('data-seg'); renderAll(); return; }
    if(a === 'job'){ openSheet({ kind: 'job', id: id, force: true }); return; }
    if(a === 'close'){ closeSheet(); return; }
    if(a === 'advance'){ advance(id); return; }
    if(a === 'ship'){ openSheet({ kind: 'job', id: id, mode: 'ship', force: true }); return; }
    if(a === 'decline'){ openSheet({ kind: 'job', id: id, mode: 'decline', force: true }); setTimeout(function(){ var t = document.getElementById('fReason'); if(t) t.focus(); }, 280); return; }
    if(a === 'undo'){
      var f0 = findJob(id); if(!f0) return;
      var e0 = store.edits[id]; if(!e0 || !e0.status) return;
      var prevIdx = FLOW.indexOf(e0.status) - 1;
      if(prevIdx <= FLOW.indexOf(f0.base.status)) delete e0.status; else e0.status = FLOW[prevIdx];
      if(Object.keys(e0).filter(function(k){ return k !== 'at'; }).length === 0) delete store.edits[id];
      save(); scheduleSave(); sheetState.force = true; renderAll(); toast('Step undone'); return;
    }
    if(a === 'ship-save'){
      var units = Math.round(num(document.getElementById('fUnits').value));
      var f1 = findJob(id); if(!f1) return;
      if(!(units > 0)){ toast('Enter how many pieces you shipped'); return; }
      setEdit(id, 'status', 'shipped');
      setEdit(id, 'unitsShipped', units);
      setEdit(id, 'shippedDate', document.getElementById('fDate').value || today());
      setEdit(id, 'trackingNo', String(document.getElementById('fAwb').value || '').trim().slice(0, 200));
      var fp = document.getElementById('fFailed'), fg = document.getElementById('fGrams');
      if(fp && fp.value !== '') setEdit(id, 'failedPrints', Math.round(num(fp.value)));
      if(fg && fg.value !== '') setEdit(id, 'gramsUsed', Math.round(num(fg.value)));
      buzz(); stopScan();
      sheetState.mode = null; sheetState.force = true;
      scheduleSave(); renderAll(); toast('Marked as shipped');
      return;
    }
    if(a === 'scan-awb'){ startScan(); return; }
    if(a === 'scan-stop'){ stopScan(); return; }
    if(a === 'save-note'){ var n = document.getElementById('fNotes'); setEdit(id, 'partnerNotes', String(n.value || '').slice(0, 2000)); scheduleSave(); toast('Note saved'); n.blur(); return; }
    if(a === 'copy-addr'){ var f2 = findJob(id); var st = (f2 && f2.j.shipTo) || {}; copy([st.name, st.address, st.phone].filter(Boolean).join('\n'), 'Address copied'); return; }
    if(a === 'req-pay'){ openSheet({ kind: 'req-pay', force: true }); return; }
    if(a === 'req-fil'){ openSheet({ kind: 'req-fil', opt: { color: b.getAttribute('data-color') || '', g: num(b.getAttribute('data-g')) }, force: true }); return; }
    if(a === 'ack-problem'){ openSheet({ kind: 'ack-problem', opt: { id: id, amt: num(b.getAttribute('data-amt')) }, force: true }); return; }
    if(a === 'profile'){ openSheet({ kind: 'profile', force: true }); return; }
    if(a === 'message'){ openSheet({ kind: 'message', force: true }); setTimeout(function(){ var t = document.getElementById('fMsg'); if(t) t.focus(); }, 280); return; }
    if(a === 'statement'){
      var txt = statementText();
      if(navigator.share){ try{ await navigator.share({ title: 'Statement', text: txt }); return; }catch(err){ if(err && err.name === 'AbortError') return; } }
      copy(txt, 'Statement copied — paste it in WhatsApp'); return;
    }
    if(a === 'install'){ if(deferredInstall){ deferredInstall.prompt(); deferredInstall.userChoice.finally(function(){ deferredInstall = null; renderAll(); }); } return; }
    if(a === 'refresh'){ refresh(); toast('Refreshing…'); return; }
    if(a === 'signout'){ if(confirm('Sign out of the Partner app on this phone?')) signOut(); return; }
    // --- things that talk to Thread Tribe ---
    b.disabled = true;
    var ok = false;
    if(a === 'decline-send'){
      ok = await submitRequest('decline', { jobId: id, reason: (document.getElementById('fReason') || {}).value || '' });
      if(ok){ toast('Sent — Thread Tribe will reply here'); if(sheetState){ sheetState.mode = null; sheetState.force = true; } }
    } else if(a === 'req-pay-send'){
      var amt = Math.round(num(document.getElementById('fAmt').value));
      if(!(amt > 0)){ toast('Enter an amount'); b.disabled = false; return; }
      ok = await submitRequest('payout', { amount: amt, note: document.getElementById('fNote').value || '' });
      if(ok){ toast('Payout request sent'); closeSheet(); }
    } else if(a === 'req-fil-send'){
      var kg = num(document.getElementById('fKg').value), col = String(document.getElementById('fColor').value || '').trim();
      if(!col || !(kg > 0)){ toast('Enter the color and how much'); b.disabled = false; return; }
      ok = await submitRequest('filament', { color: col, material: document.getElementById('fMat').value || '', grams: Math.round(kg * 1000), note: document.getElementById('fNote').value || '' });
      if(ok){ toast('Filament request sent'); closeSheet(); }
    } else if(a === 'ack-ok' || a === 'ack-send'){
      ok = await submitRequest('payment_ack', { paymentId: id, ok: a === 'ack-ok', amount: num(b.getAttribute('data-amt')), note: a === 'ack-send' ? (document.getElementById('fNote').value || '') : '' });
      if(ok){ store.seenPay[id] = 1; save(); toast(a === 'ack-ok' ? 'Thanks — marked as received' : 'Sent to Thread Tribe'); if(a === 'ack-send') closeSheet(); buzz(); }
    } else if(a === 'withdraw'){
      var r = await sb.rpc('pon_cancel_request', { p_id: id });
      if(r.error) toast(friendlyErr(r.error)); else { ping('request'); await loadInbox(store.partnerId); toast('Withdrawn'); ok = true; if(sheetState) sheetState.force = true; }
    } else if(a === 'profile-save'){
      var g = function(i){ return (document.getElementById(i) || {}).value || ''; };
      if(!g('pUpi').trim() && !g('pAcc').trim()){ toast('Add a UPI ID or bank account'); b.disabled = false; return; }
      var rs = await sb.rpc('pon_save_profile', { p_partner_id: store.partnerId, p: { upi: g('pUpi'), accountName: g('pName'), accountNo: g('pAcc'), ifsc: g('pIfsc'), bankName: g('pBank') } });
      if(rs.error) toast(friendlyErr(rs.error)); else { ping('request'); await loadInbox(store.partnerId); toast('Payment details saved'); closeSheet(); ok = true; }
    } else if(a === 'message-send'){
      var t = String(document.getElementById('fMsg').value || '').trim();
      if(!t){ toast('Write a message first'); b.disabled = false; return; }
      ok = await submitRequest('message', { text: t });
      if(ok){ toast('Message sent'); closeSheet(); }
    }
    b.disabled = false;
    renderAll();
  }
  document.getElementById('screen').addEventListener('click', onAction);
  document.getElementById('sheet').addEventListener('click', onAction);
  document.getElementById('scrim').addEventListener('click', function(){ closeSheet(); });
  document.getElementById('sync').addEventListener('click', function(){ if(cloud.status === 'error' || cloud.status === 'offline'){ scheduleSave(); refresh(); } else setTab('me'); });
  document.getElementById('nav').addEventListener('click', function(e){ var b = e.target.closest('[data-tab]'); if(b) setTab(b.getAttribute('data-tab')); });
  function setTab(t){ tab = t; closeSheet(); renderAll(); window.scrollTo(0, 0); }

  function statementText(){
    var p = store.pack, pay = p.payout || {};
    var lines = ['Statement — ' + (p.partner.name || '') + ' (' + fmtDate(today()) + ')', 'Rate: ₹' + (p.partner.ratePerGram || 0) + '/g', ''];
    var done = (p.jobs || []).filter(function(j){ return j.status === 'delivered'; });
    if(done.length){ lines.push('Delivered:'); done.forEach(function(j){ lines.push('• ' + j.jobCode + ' ' + j.productName + ': ' + Math.max(0, (j.unitsShipped || 0) - (j.clientRejects || 0)) + ' pcs = ' + money(j.payout)); }); lines.push(''); }
    (pay.payments || []).slice(0, 10).forEach(function(x, i){ if(i === 0) lines.push('Payments:'); lines.push('• ' + fmtDate(x.date) + ' ' + money(x.amount) + (x.ref ? ' (' + x.ref + ')' : '')); });
    lines.push('', 'Earned: ' + money(pay.earned), 'Paid: ' + money(pay.paid), 'To be paid: ' + money(pay.outstanding));
    return lines.join('\n');
  }

  // ---- pull down to refresh ----
  (function(){
    var y0 = null, ptr = document.getElementById('ptr');
    window.addEventListener('touchstart', function(e){ y0 = (window.scrollY <= 0 && !sheetState) ? e.touches[0].clientY : null; }, { passive: true });
    window.addEventListener('touchmove', function(e){ if(y0 == null) return; var d = e.touches[0].clientY - y0; ptr.style.height = d > 20 ? Math.min(40, d / 3) + 'px' : '0'; }, { passive: true });
    window.addEventListener('touchend', function(e){
      if(y0 == null) return;
      var d = (e.changedTouches[0].clientY - y0); y0 = null; ptr.style.height = '0';
      if(d > 110 && session){ refresh(); toast('Refreshing…'); }
    });
  })();

  // ---- install + offline ----
  var deferredInstall = null;
  window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); deferredInstall = e; renderAll(); });
  window.addEventListener('appinstalled', function(){ deferredInstall = null; toast('Installed — open TT Partner from your home screen'); });
  if('serviceWorker' in navigator && /^https?:/.test(location.protocol)){ window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
  if(navigator.storage && navigator.storage.persist){ navigator.storage.persist().catch(function(){}); }

  function init(){
    load();
    if(CFG.instanceName) document.getElementById('eyebrow').textContent = 'Thread Tribe Partner · ' + CFG.instanceName;
    if(window.supabase && window.supabase.createClient){
      try{ sb = window.supabase.createClient(CLOUD_URL, CLOUD_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false, storageKey: 'tt-partner-auth' } }); }catch(e){ sb = null; }
    }
    if(sb){
      sb.auth.onAuthStateChange(function(ev, s){
        setTimeout(function(){
          cloud.booting = false;
          if(s && (ev === 'SIGNED_IN' || ev === 'INITIAL_SESSION' || ev === 'TOKEN_REFRESHED')) onSignedIn(s);
          else if(ev === 'INITIAL_SESSION' && !s){ renderAll(); }
          else if(ev === 'SIGNED_OUT' && session){ session = null; renderAll(); }
        }, 0);
      });
      document.addEventListener('visibilitychange', function(){ if(!document.hidden && session) refreshSoon(100); });
      window.addEventListener('online', function(){ if(session){ refreshSoon(100); scheduleSave(); } });
      window.addEventListener('offline', function(){ cloud.status = 'offline'; renderSync(); });
      setInterval(function(){ if(!document.hidden && session) refresh(); }, 15000);
      setTimeout(function(){ if(cloud.booting){ cloud.booting = false; renderAll(); } }, 4000);
    } else cloud.booting = false;
    renderAll();
  }
  init();
})();
</script>
</body>
</html>
